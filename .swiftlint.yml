included:
  - FrameGate
  - Packages/FrameGateCore/Sources
  - Packages/FrameGateCore/Tests

excluded:
  - Packages/FrameGateCore/.build

opt_in_rules:
  - force_unwrapping

force_unwrapping:
  severity: error

line_length:
  warning: 140
  error: 200

identifier_name:
  excluded:
    - id
    - at
    - x
    - y

function_parameter_count:
  warning: 8
  error: 10
